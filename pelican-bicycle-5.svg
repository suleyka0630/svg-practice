<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Night sky with stars -->
  <rect width="800" height="600" fill="#0a1432"/>
  <circle cx="750" cy="50" r="20" fill="#fff"/>
  <g fill="#fff">
    <circle cx="100" cy="120" r="2"/>
    <circle cx="250" cy="80" r="1.5"/>
    <circle cx="400" cy="150" r="2.5"/>
    <circle cx="600" cy="110" r="1"/>
    <circle cx="720" cy="90" r="3"/>
  </g>
  <!-- Moon -->
  <circle cx="150" cy="100" r="30" fill="#f2d0a8"/>
  <path d="M150 70 Q130 80 150 90 Q170 80 170 70 Z" fill="none" stroke="#f2d0a8" stroke-width="4"/>

  <!-- Ground -->
  <rect y="490" width="800" height="110" fill="#1e3a5f"/>
  <path d="M0 490 Q100 480 200 495 Q300 510 400 490 Q500 470 600 495 Q700 520 800 495 L800 500 L0 500 Z" fill="#2c5a8a"/>

  <!-- Bicycle lights -->
  <circle cx="300" cy="460" r="8" fill="#f7e469"/>
  <circle cx="600" cy="460" r="8" fill="#f7e469"/>

  <!-- Wheels -->
  <g>
    <circle cx="260" cy="455" r="58" fill="#222"/>
    <circle cx="260" cy="455" r="52" fill="none" stroke="#fff" stroke-width="3"/>
    <circle cx="545" cy="455" r="58" fill="#222"/>
    <circle cx="545" cy="455" r="52" fill="none" stroke="#fff" stroke-width="3"/>
    <g stroke="#fff" stroke-width="2.5">
      <line x1="260" y1="397" x2="260" y2="513"/>
      <line x1="202" y1="455" x2="318" y2="455"/>
      <line x1="219" y1="412" x2="301" y2="495"/>
      <line x1="301" y1="412" x2="219" y2="495"/>
      <line x1="545" y1="397" x2="545" y2="513"/>
      <line x1="487" y1="455" x2="603" y2="455"/>
      <line x1="504" y1="412" x2="586" y2="495"/>
      <line x1="586" y1="412" x2="504" y2="495"/>
    </g>
  </g>

  <!-- Frame -->
  <g stroke="#e84545" stroke-width="10" fill="none" stroke-linecap="round">
    <line x1="260" y1="455" x2="390" y2="455"/>
    <line x1="260" y1="455" x2="330" y2="340"/>
    <line x1="390" y1="455" x2="330" y2="340"/>
    <line x1="330" y1="340" x2="485" y2="330"/>
    <line x1="390" y1="455" x2="485" y2="330"/>
    <line x1="485" y1="330" x2="545" y2="455"/>
  </g>

  <!-- Handlebar -->
  <path d="M485 330 L478 300 Q475 290 495 290 L530 290" fill="none" stroke="#333" stroke-width="8"/>

  <!-- Seat -->
  <line x1="330" y1="340" x2="327" y2="322" stroke="#333" stroke-width="6"/>
  <ellipse cx="318" cy="318" rx="22" ry="7" fill="#333"/>

  <!-- Pedals -->
  <circle cx="390" cy="455" r="9" fill="#333"/>
  <line x1="390" y1="455" x2="365" y2="490" stroke="#333" stroke-width="6"/>
  <line x1="365" y1="490" x2="352" y2="490" stroke="#333" stroke-width="8" stroke-linecap="round"/>

  <!-- Pelican -->
  <!-- Tail -->
  <path d="M285 250 L235 260 L285 285 Z" fill="#e8e8e8"/>
  <!-- Body -->
  <ellipse cx="350" cy="250" rx="70" ry="50" fill="white"/>
  <!-- Wing -->
  <path d="M305 240 Q355 210 405 240 Q355 270 305 240 Z" fill="#f5f5f5"/>
  <!-- Neck -->
  <path d="M400 240 Q420 185 438 165" fill="none" stroke="white" stroke-width="28" stroke-linecap="round"/>
  <!-- Head -->
  <circle cx="445" cy="145" r="24" fill="white"/>
  <!-- Beak -->
  <path d="M465 138 Q545 140 568 158 Q540 172 468 162 Z" fill="#ffaa33"/>
  <!-- Pouch -->
  <path d="M468 160 Q520 185 550 168 Q525 198 472 178 Z" fill="#e58a2e"/>
  <!-- Eye -->
  <circle cx="452" cy="139" r="5" fill="#222"/>
  <!-- Wing/arm -->
  <path d="M398 255 Q445 270 480 298" fill="none" stroke="white" stroke-width="15" stroke-linecap="round"/>
  <!-- Legs -->
  <path d="M348 295 Q362 380 358 470" fill="none" stroke="#ffaa33" stroke-width="9" stroke-linecap="round"/>
  <path d="M382 295 Q396 360 390 430" fill="none" stroke="#e58a2e" stroke-width="9" stroke-linecap="round"/>
  <!-- Feet -->
  <ellipse cx="358" cy="474" rx="13" ry="6" fill="#e58a2e"/>
  <ellipse cx="390" cy="434" rx="12" ry="6" fill="#ffaa33"/>
</svg>